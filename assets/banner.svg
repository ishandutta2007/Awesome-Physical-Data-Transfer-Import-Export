<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.6)); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    @keyframes pulseParticle {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(30px, -20px) scale(1.4); opacity: 0.8; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    .particle { animation: pulseParticle 6s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 20 10; animation: flowLine 15s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Dynamic / Animated Background Graphics (Behind text foreground) -->
  <g stroke="url(#lineGrad)" stroke-width="2" fill="none" class="flow-line" opacity="0.4">
    <path d="M-50 240 Q 300 120, 600 240 T 1250 160" />
    <path d="M-50 80 Q 400 280, 800 100 T 1250 220" />
  </g>

  <!-- Glowing background nodes -->
  <circle cx="150" cy="80" r="40" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1050" cy="240" r="60" fill="#c084fc" opacity="0.15" filter="url(#glow)"/>
  <circle cx="900" cy="70" r="35" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Animated floating particles -->
  <circle cx="220" cy="260" r="4" fill="#38bdf8" class="particle" />
  <circle cx="980" cy="120" r="5" fill="#c084fc" class="particle" style="animation-delay: -2s;" />
  <circle cx="550" cy="50" r="3" fill="#818cf8" class="particle" style="animation-delay: -4s;" />

  <!-- Data Transfer Nodes Visualization (Background details) -->
  <g stroke="#475569" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="850" y1="210" x2="930" y2="250" />
    <line x1="930" y1="250" x2="1020" y2="200" />
    <circle cx="850" cy="210" r="6" fill="#38bdf8"/>
    <circle cx="930" cy="250" r="8" fill="#818cf8"/>
    <circle cx="1020" cy="200" r="7" fill="#c084fc"/>
  </g>

  <!-- FOREGROUND LAYER: Title and Subtitle -->
  <g transform="translate(60, 110)">
    <!-- Main Title -->
    <text x="0" y="0" class="title">Awesome Physical Data Transfer &amp; Import/Export 🚚📦</text>
    
    <!-- Subtitle -->
    <text x="0" y="42" class="subtitle">Bulk Data Migration • WAN Acceleration • Self-Hosted Cloud &amp; Database Sync Ecosystem</text>
    
    <!-- Decorative Tag Pills in Foreground -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="80" y="22" text-anchor="middle" class="badge-text">📦 Physical Transfer</text>

      <rect x="175" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="255" y="22" text-anchor="middle" class="badge-text">🚀 WAN Speedup</text>

      <rect x="350" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="430" y="22" text-anchor="middle" class="badge-text">🔄 Cloud &amp; DB Sync</text>
    </g>
  </g>
</svg>
